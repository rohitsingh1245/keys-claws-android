name: Build Fixed APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fixed-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          

      - name: Extract source and set Worker URL
        shell: bash
        run: |
          set -euo pipefail

          unzip -q Keys_Claws_Quest_for_Home_3D_Jungle_v2.2_Source.zip -d extracted

          wrapper="$(find extracted -type f -name gradlew -print -quit
